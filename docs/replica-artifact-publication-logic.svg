<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260">
  <defs><style>.title{font:700 42px Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#373737}.col{font:700 25px Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#66625c}.h{font:700 30px Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}.b{font:500 24px Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}.s{font:500 20px Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}.why{font:700 22px Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#6e5414}.a{fill:none;stroke:#8d8b85;stroke-width:4;marker-end:url(#m)}.d{fill:none;stroke:#b7a878;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#md)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="none" stroke="#8d8b85" stroke-width="2"/></marker><marker id="md" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#b7a878" stroke-width="2"/></marker></defs>
  <rect width="1800" height="1260" fill="#fff"/><text x="900" y="65" text-anchor="middle" class="title">3. Replica 산출물 생성·공개와 이유</text><text x="610" y="115" text-anchor="middle" class="col">동작</text><text x="1490" y="115" text-anchor="middle" class="col">왜 필요한가</text>

  <rect x="120" y="145" width="1020" height="145" rx="20" fill="#fff8df" stroke="#b98a19" stroke-width="1.5"/><text x="630" y="192" text-anchor="middle" class="h" fill="#77560b">비공개 평가 run 완성</text><text x="630" y="234" text-anchor="middle" class="b" fill="#8c6815">실행물 + frozen tests + 원본 출력 + Judge 결과</text><text x="630" y="270" text-anchor="middle" class="s" fill="#94711e">completion report까지 한 run에 결속</text>
  <path d="M1140 217L1210 217" class="d"/><rect x="1225" y="153" width="455" height="130" rx="18" fill="#fff8df" stroke="#c9a84e" stroke-width="1.4"/><text x="1452" y="190" text-anchor="middle" class="why">이유</text><text x="1452" y="228" text-anchor="middle" class="s" fill="#77560b">평가에 사용된 구현·입력·결과를</text><text x="1452" y="260" text-anchor="middle" class="s" fill="#77560b">하나의 감사 가능한 단위로 묶기 위해</text>

  <path d="M630 290L630 335" class="a"/><rect x="120" y="347" width="1020" height="170" rx="20" fill="#efefff" stroke="#5e5de8" stroke-width="1.5"/><text x="630" y="394" text-anchor="middle" class="h" fill="#39398f">Completion Standard gate</text><text x="630" y="436" text-anchor="middle" class="b" fill="#4e4dbd">근거 · 실제 입력/출력 · novel · 분리 평가 · 의존성</text><text x="630" y="474" text-anchor="middle" class="s" fill="#6261a9">구현/명령/component digest · scenario · 보고서 일치 검증</text>
  <path d="M1140 432L1210 432" class="d"/><rect x="1225" y="359" width="455" height="150" rx="18" fill="#fff8df" stroke="#c9a84e" stroke-width="1.4"/><text x="1452" y="397" text-anchor="middle" class="why">이유</text><text x="1452" y="435" text-anchor="middle" class="s" fill="#77560b">테스트 통과만으로 완료라 하지 않고</text><text x="1452" y="467" text-anchor="middle" class="s" fill="#77560b">실제 입력과 최종 산출물까지 확인</text>

  <path d="M630 517L630 562" class="a"/><rect x="120" y="574" width="1020" height="145" rx="20" fill="#dcf3ed" stroke="#087660" stroke-width="1.5"/><text x="630" y="621" text-anchor="middle" class="h" fill="#075c4c">공개 경계 필터 적용</text><text x="630" y="663" text-anchor="middle" class="b" fill="#08705c">허용된 파일만 복사 · 공개용 결과·보고서 새로 생성</text><text x="630" y="698" text-anchor="middle" class="s" fill="#397f72">completion contract에서는 case ID 제거</text>
  <path d="M1140 646L1210 646" class="d"/><rect x="1225" y="586" width="455" height="125" rx="18" fill="#fff8df" stroke="#c9a84e" stroke-width="1.4"/><text x="1452" y="624" text-anchor="middle" class="why">이유</text><text x="1452" y="662" text-anchor="middle" class="s" fill="#77560b">숨은 정답·사례별 출력·채점 결과가</text><text x="1452" y="694" text-anchor="middle" class="s" fill="#77560b">공개 run으로 새는 것을 방지</text>

  <path d="M630 719L630 764" class="a"/><rect x="120" y="776" width="1020" height="215" rx="20" fill="#e3f1ff" stroke="#176dc2" stroke-width="1.5"/><text x="630" y="821" text-anchor="middle" class="h" fill="#0b4e8f">Private 유지 / Public 복사</text><text x="380" y="865" text-anchor="middle" class="b" fill="#a63c23">Vault 전용</text><text x="870" y="865" text-anchor="middle" class="b" fill="#1763ac">Public run</text><text x="380" y="901" text-anchor="middle" class="s" fill="#a65340">tests · lock · outputs · results</text><text x="870" y="901" text-anchor="middle" class="s" fill="#3f72a4">implementation · replica · spec · plan</text><text x="380" y="934" text-anchor="middle" class="s" fill="#a65340">원본 second-pass · 기대 출력</text><text x="870" y="934" text-anchor="middle" class="s" fill="#3f72a4">generated component · evaluation summary</text><text x="630" y="972" text-anchor="middle" class="s" fill="#4f789e">비공개 근거는 보존하고 실행 가능한 최소 묶음만 공개</text>
  <path d="M1140 883L1210 883" class="d"/><rect x="1225" y="790" width="455" height="185" rx="18" fill="#fff8df" stroke="#c9a84e" stroke-width="1.4"/><text x="1452" y="828" text-anchor="middle" class="why">이유</text><text x="1452" y="866" text-anchor="middle" class="s" fill="#77560b">Vault는 감사·재검증 근거를 보존하고</text><text x="1452" y="898" text-anchor="middle" class="s" fill="#77560b">Public run은 정답 없이도</text><text x="1452" y="930" text-anchor="middle" class="s" fill="#77560b">독립적으로 재실행 가능해야 함</text>

  <path d="M630 991L630 1036" class="a"/><rect x="120" y="1048" width="1020" height="170" rx="20" fill="#eaf5ff" stroke="#4a87c5" stroke-width="1.5"/><text x="630" y="1095" text-anchor="middle" class="h" fill="#184f84">공개용 최종 파일 생성</text><text x="630" y="1137" text-anchor="middle" class="b" fill="#376e9f">completion-assessment.json · replica-result.json</text><text x="630" y="1175" text-anchor="middle" class="b" fill="#376e9f">report.json · report.md</text><text x="630" y="1205" text-anchor="middle" class="s" fill="#4f789e">reproduction_status · 범위 · 제한 · 공개 근거 기록</text>
  <path d="M1140 1133L1210 1133" class="d"/><rect x="1225" y="1060" width="455" height="150" rx="18" fill="#fff8df" stroke="#c9a84e" stroke-width="1.4"/><text x="1452" y="1098" text-anchor="middle" class="why">이유</text><text x="1452" y="1136" text-anchor="middle" class="s" fill="#77560b">기계는 JSON으로, 사람은 Markdown으로</text><text x="1452" y="1168" text-anchor="middle" class="s" fill="#77560b">동일한 완료 상태를 확인하게 함</text>

</svg>
