<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500">
  <defs>
    <style>.title{font:700 42px Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#373737}.col{font:700 25px Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#66625c}.h{font:700 30px Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}.b{font:500 24px Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}.s{font:500 20px Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}.why{font:700 22px Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#6e5414}.a{fill:none;stroke:#8d8b85;stroke-width:4;marker-end:url(#m)}.d{fill:none;stroke:#b7a878;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#md)}</style>
    <marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="none" stroke="#8d8b85" stroke-width="2"/></marker>
    <marker id="md" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#b7a878" stroke-width="2"/></marker>
  </defs>
  <rect width="1800" height="1500" fill="#fff"/>
  <text x="900" y="65" text-anchor="middle" class="title">1. build-replica-operator 동작과 이유</text>
  <text x="610" y="115" text-anchor="middle" class="col">동작</text><text x="1490" y="115" text-anchor="middle" class="col">왜 필요한가</text>

  <rect x="120" y="145" width="1020" height="150" rx="20" fill="#efefff" stroke="#5e5de8" stroke-width="1.5"/>
  <text x="630" y="194" text-anchor="middle" class="h" fill="#39398f">Second-pass 경로 → prepare-operator</text>
  <text x="630" y="235" text-anchor="middle" class="b" fill="#4e4dbd">계약 검증 · 경로 분리 · intake SHA-256 생성</text>
  <text x="630" y="269" text-anchor="middle" class="s" fill="#6261a9">원본을 직접 열지 않고 결정론적 준비 명령으로 처리</text>
  <path d="M1140 220L1210 220" class="d"/>
  <rect x="1225" y="150" width="455" height="140" rx="18" fill="#fff8df" stroke="#c9a84e" stroke-width="1.4"/>
  <text x="1452" y="187" text-anchor="middle" class="why">이유</text>
  <text x="1452" y="225" text-anchor="middle" class="s" fill="#77560b">잘못된 계약이나 경로 중첩을</text>
  <text x="1452" y="257" text-anchor="middle" class="s" fill="#77560b">구현 시작 전에 차단하기 위해</text>

  <path d="M630 295L630 340" class="a"/>
  <rect x="120" y="352" width="1020" height="180" rx="20" fill="#e3f1ff" stroke="#176dc2" stroke-width="1.5"/>
  <text x="630" y="397" text-anchor="middle" class="h" fill="#0b4e8f">공개 Task와 비공개 Vault 분리</text>
  <text x="380" y="438" text-anchor="middle" class="b" fill="#1763ac">공개 Task</text><text x="880" y="438" text-anchor="middle" class="b" fill="#8c6815">Evaluator Vault</text>
  <text x="380" y="473" text-anchor="middle" class="s" fill="#3f72a4">request · task · attempts</text><text x="880" y="473" text-anchor="middle" class="s" fill="#94711e">원본 · tests · expected outputs</text>
  <text x="630" y="510" text-anchor="middle" class="s" fill="#4f789e">구현자에게는 공개 계약만 전달</text>
  <path d="M1140 442L1210 442" class="d"/>
  <rect x="1225" y="365" width="455" height="160" rx="18" fill="#fff8df" stroke="#c9a84e" stroke-width="1.4"/>
  <text x="1452" y="403" text-anchor="middle" class="why">이유</text>
  <text x="1452" y="441" text-anchor="middle" class="s" fill="#77560b">정답과 기대 출력을 본 뒤</text>
  <text x="1452" y="473" text-anchor="middle" class="s" fill="#77560b">테스트 전용 코드를 만드는</text>
  <text x="1452" y="505" text-anchor="middle" class="s" fill="#77560b">하드코딩을 막기 위해</text>

  <path d="M630 532L630 577" class="a"/>
  <rect x="120" y="589" width="1020" height="160" rx="20" fill="#dcf3ed" stroke="#087660" stroke-width="1.5"/>
  <text x="630" y="636" text-anchor="middle" class="h" fill="#075c4c">Codex가 operator-request.json만 읽음</text>
  <text x="630" y="678" text-anchor="middle" class="b" fill="#08705c">공개 claim·계약·범위만으로 operator.json 작성</text>
  <text x="630" y="716" text-anchor="middle" class="s" fill="#397f72">입출력 계약은 그대로 복사 · 내부 구현 추정 금지</text>
  <path d="M1140 669L1210 669" class="d"/>
  <rect x="1225" y="599" width="455" height="145" rx="18" fill="#fff8df" stroke="#c9a84e" stroke-width="1.4"/>
  <text x="1452" y="637" text-anchor="middle" class="why">이유</text>
  <text x="1452" y="675" text-anchor="middle" class="s" fill="#77560b">공개 근거로 재현 가능한 범위만</text>
  <text x="1452" y="707" text-anchor="middle" class="s" fill="#77560b">구현하게 해 과장과 추정을 방지</text>

  <path d="M630 749L630 794" class="a"/>
  <rect x="120" y="806" width="1020" height="160" rx="20" fill="#eaf5ff" stroke="#4a87c5" stroke-width="1.5"/>
  <text x="630" y="853" text-anchor="middle" class="h" fill="#184f84">finalize-operator</text>
  <text x="630" y="895" text-anchor="middle" class="b" fill="#376e9f">스키마 검증 → 실행 검증 → frozen test 평가</text>
  <text x="630" y="933" text-anchor="middle" class="s" fill="#4f789e">검증되지 않은 operator는 공개 run으로 이동하지 않음</text>
  <path d="M1140 886L1210 886" class="d"/>
  <rect x="1225" y="816" width="455" height="145" rx="18" fill="#fff8df" stroke="#c9a84e" stroke-width="1.4"/>
  <text x="1452" y="854" text-anchor="middle" class="why">이유</text>
  <text x="1452" y="892" text-anchor="middle" class="s" fill="#77560b">형식만 맞는 코드가 아니라</text>
  <text x="1452" y="924" text-anchor="middle" class="s" fill="#77560b">실제로 실행되고 계약을 지키는지 확인</text>

  <path d="M630 966L630 1011" class="a"/>
  <rect x="120" y="1023" width="1020" height="180" rx="20" fill="#fff0ea" stroke="#bf4c2e" stroke-width="1.5"/>
  <text x="630" y="1068" text-anchor="middle" class="h" fill="#85301c">실패 시 최소 정보로 수정</text>
  <text x="630" y="1110" text-anchor="middle" class="b" fill="#a63c23">VALIDATION / RUNTIME / EVALUATION_FAILED</text>
  <text x="630" y="1148" text-anchor="middle" class="s" fill="#a65340">평가 실패는 pass count만 반환 · 총 3회 시도 제한</text>
  <text x="630" y="1180" text-anchor="middle" class="s" fill="#a65340">통과하면 BUILT_AND_PASSED · task COMPLETED</text>
  <path d="M1140 1113L1210 1113" class="d"/>
  <rect x="1225" y="1036" width="455" height="160" rx="18" fill="#fff8df" stroke="#c9a84e" stroke-width="1.4"/>
  <text x="1452" y="1074" text-anchor="middle" class="why">이유</text>
  <text x="1452" y="1112" text-anchor="middle" class="s" fill="#77560b">실패 원인으로 정답이 새는 것을 막고</text>
  <text x="1452" y="1144" text-anchor="middle" class="s" fill="#77560b">무한 수정·평가 과적합을</text>
  <text x="1452" y="1176" text-anchor="middle" class="s" fill="#77560b">동시에 제한하기 위해</text>

  <path d="M630 1203L630 1248" class="a"/>
  <rect x="250" y="1260" width="760" height="112" rx="20" fill="#e3f3e9" stroke="#21835d" stroke-width="1.5"/>
  <text x="630" y="1305" text-anchor="middle" class="h" fill="#116845">검증된 Public run 게시</text>
  <text x="630" y="1346" text-anchor="middle" class="b" fill="#2b765b">사용자는 공개 run만 실행</text>
  <path d="M1010 1316L1210 1316" class="d"/>
  <rect x="1225" y="1254" width="455" height="124" rx="18" fill="#fff8df" stroke="#c9a84e" stroke-width="1.4"/>
  <text x="1452" y="1292" text-anchor="middle" class="why">이유</text>
  <text x="1452" y="1330" text-anchor="middle" class="s" fill="#77560b">평가 자료 없이도 재실행 가능한</text>
  <text x="1452" y="1362" text-anchor="middle" class="s" fill="#77560b">고객용 결과만 전달하기 위해</text>
</svg>
