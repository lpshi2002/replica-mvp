<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500">
  <defs><style>.title{font:700 42px Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#373737}.col{font:700 25px Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#66625c}.h{font:700 30px Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}.b{font:500 24px Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}.s{font:500 20px Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}.why{font:700 22px Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;fill:#6e5414}.a{fill:none;stroke:#8d8b85;stroke-width:4;marker-end:url(#m)}.d{fill:none;stroke:#b7a878;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#md)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12" fill="none" stroke="#8d8b85" stroke-width="2"/></marker><marker id="md" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#b7a878" stroke-width="2"/></marker></defs>
  <rect width="1800" height="1500" fill="#fff"/><text x="900" y="65" text-anchor="middle" class="title">2. Replica 구현·동결 테스트 평가와 이유</text><text x="610" y="115" text-anchor="middle" class="col">동작</text><text x="1490" y="115" text-anchor="middle" class="col">왜 필요한가</text>

  <rect x="120" y="145" width="1020" height="155" rx="20" fill="#e3f1ff" stroke="#176dc2" stroke-width="1.5"/>
  <text x="630" y="193" text-anchor="middle" class="h" fill="#0b4e8f">operator.json → Generated Component</text><text x="630" y="234" text-anchor="middle" class="b" fill="#1763ac">계약·language 검증 · component/request SHA-256 생성</text><text x="630" y="270" text-anchor="middle" class="s" fill="#3f72a4">expression 또는 replicate(runtime_input) Python</text>
  <path d="M1140 222L1210 222" class="d"/><rect x="1225" y="153" width="455" height="140" rx="18" fill="#fff8df" stroke="#c9a84e" stroke-width="1.4"/><text x="1452" y="190" text-anchor="middle" class="why">이유</text><text x="1452" y="228" text-anchor="middle" class="s" fill="#77560b">계약과 다른 구현을 막고</text><text x="1452" y="260" text-anchor="middle" class="s" fill="#77560b">평가된 코드의 신원을 고정하기 위해</text>

  <path d="M630 300L630 345" class="a"/><rect x="120" y="357" width="1020" height="185" rx="20" fill="#eaf5ff" stroke="#4a87c5" stroke-width="1.5"/>
  <text x="630" y="403" text-anchor="middle" class="h" fill="#184f84">Private run에 실행물 패키징</text><text x="630" y="444" text-anchor="middle" class="b" fill="#376e9f">replica-spec · execution-plan · replica.json</text><text x="630" y="480" text-anchor="middle" class="b" fill="#376e9f">generated-component · implementation/replica.py · manifest</text><text x="630" y="516" text-anchor="middle" class="s" fill="#4f789e">동일한 코드·계약·실행 명령을 한 run으로 묶음</text>
  <path d="M1140 449L1210 449" class="d"/><rect x="1225" y="370" width="455" height="160" rx="18" fill="#fff8df" stroke="#c9a84e" stroke-width="1.4"/><text x="1452" y="408" text-anchor="middle" class="why">이유</text><text x="1452" y="446" text-anchor="middle" class="s" fill="#77560b">나중에 실행 코드만 바꿔치기하거나</text><text x="1452" y="478" text-anchor="middle" class="s" fill="#77560b">실행 불가능한 명령을 기록하는</text><text x="1452" y="510" text-anchor="middle" class="s" fill="#77560b">거짓 완료를 방지하기 위해</text>

  <path d="M630 542L630 587" class="a"/><rect x="120" y="599" width="1020" height="165" rx="20" fill="#fff8df" stroke="#b98a19" stroke-width="1.5"/>
  <text x="630" y="646" text-anchor="middle" class="h" fill="#77560b">Frozen suite 결합</text><text x="630" y="688" text-anchor="middle" class="b" fill="#8c6815">normal · boundary · insufficient_information · novel</text><text x="630" y="727" text-anchor="middle" class="s" fill="#94711e">tests.json과 test-suite-lock.json의 hash 확인</text>
  <path d="M1140 681L1210 681" class="d"/><rect x="1225" y="611" width="455" height="145" rx="18" fill="#fff8df" stroke="#c9a84e" stroke-width="1.4"/><text x="1452" y="649" text-anchor="middle" class="why">이유</text><text x="1452" y="687" text-anchor="middle" class="s" fill="#77560b">구현 결과를 본 다음 테스트나</text><text x="1452" y="719" text-anchor="middle" class="s" fill="#77560b">기대값을 바꾸지 못하게 고정</text>

  <path d="M630 764L630 809" class="a"/><rect x="120" y="821" width="1020" height="170" rx="20" fill="#fff0ea" stroke="#bf4c2e" stroke-width="1.5"/>
  <text x="630" y="868" text-anchor="middle" class="h" fill="#85301c">각 case를 격리 프로세스에서 실행</text><text x="630" y="910" text-anchor="middle" class="b" fill="#a63c23">JSON 입력 → replica.py → JSON 출력</text><text x="630" y="948" text-anchor="middle" class="s" fill="#a65340">AST · import/file/network · timeout · 메모리·입출력 크기 제한</text>
  <path d="M1140 906L1210 906" class="d"/><rect x="1225" y="833" width="455" height="150" rx="18" fill="#fff8df" stroke="#c9a84e" stroke-width="1.4"/><text x="1452" y="871" text-anchor="middle" class="why">이유</text><text x="1452" y="909" text-anchor="middle" class="s" fill="#77560b">생성 코드의 파일·네트워크 접근과</text><text x="1452" y="941" text-anchor="middle" class="s" fill="#77560b">무한 실행이 시스템에 미치는 영향 차단</text>

  <path d="M630 991L630 1036" class="a"/><rect x="120" y="1048" width="1020" height="170" rx="20" fill="#efefff" stroke="#5e5de8" stroke-width="1.5"/>
  <text x="630" y="1095" text-anchor="middle" class="h" fill="#39398f">출력 저장 → Judge 판정</text><text x="630" y="1137" text-anchor="middle" class="b" fill="#4e4dbd">replica_outputs.jsonl → assertions → results.jsonl</text><text x="630" y="1175" text-anchor="middle" class="s" fill="#6261a9">구현 digest가 달라지면 기존 평가를 무효화</text>
  <path d="M1140 1133L1210 1133" class="d"/><rect x="1225" y="1060" width="455" height="150" rx="18" fill="#fff8df" stroke="#c9a84e" stroke-width="1.4"/><text x="1452" y="1098" text-anchor="middle" class="why">이유</text><text x="1452" y="1136" text-anchor="middle" class="s" fill="#77560b">코드 생성과 판정을 분리하고</text><text x="1452" y="1168" text-anchor="middle" class="s" fill="#77560b">출력·채점 결과의 위변조를 탐지</text>

  <path d="M630 1218L630 1263" class="a"/><rect x="120" y="1275" width="1020" height="150" rx="20" fill="#f2f0e9" stroke="#6f6b63" stroke-width="1.5"/>
  <text x="630" y="1322" text-anchor="middle" class="h" fill="#44413d">evaluation-summary.json → Completion gate</text><text x="630" y="1364" text-anchor="middle" class="b" fill="#625f5b">status · passed/total · suite/outputs/results SHA-256</text><text x="630" y="1400" text-anchor="middle" class="s" fill="#77736d">Judge identity와 mode 기록</text>
  <path d="M1140 1350L1210 1350" class="d"/><rect x="1225" y="1287" width="455" height="132" rx="18" fill="#fff8df" stroke="#c9a84e" stroke-width="1.4"/><text x="1452" y="1325" text-anchor="middle" class="why">이유</text><text x="1452" y="1363" text-anchor="middle" class="s" fill="#77560b">정답은 숨기면서도 평가 상태와</text><text x="1452" y="1395" text-anchor="middle" class="s" fill="#77560b">무결성은 다음 단계가 검증하도록 전달</text>
</svg>
