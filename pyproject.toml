[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replica-mvp"
version = "0.1.0"
requires-python = ">=3.12"

[project.scripts]
replica-mvp = "replica_mvp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["replica_mvp*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
